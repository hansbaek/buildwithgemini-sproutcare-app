<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SproutCare</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent:#2e7d32;
    --accent-hover:#1b5e20;
    --bg:#f4f7f4;
    --card-bg:#ffffff;
    --border:#c8d6c9;
    --text-primary:#233324;
    --text-secondary:#5f7360;
    --bubble-bg:#ffffff;
    --header-bg:#2e7d32;
    --header-text:#ffffff;
  }

  body[data-theme="dark"] {
    --accent:#66bb6a;
    --accent-hover:#81c784;
    --bg:#141d15;
    --card-bg:#1e2920;
    --border:#2f4032;
    --text-primary:#e1eee2;
    --text-secondary:#9eb3a0;
    --bubble-bg:#1e2920;
    --header-bg:#1b2e1e;
    --header-text:#e8f5e9;
  }

  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text-primary); display:flex; flex-direction:column; height:100vh; transition:background-color .3s, color .3s; }
  
  /* Header & Action Controls */
  header { background:var(--header-bg); color:var(--header-text); padding:.8rem 1.2rem; font-weight:700; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.1); z-index:10; }
  .header-brand { display:flex; align-items:center; gap:.5rem; font-size:1.15rem; }
  .header-actions { display:flex; align-items:center; gap:.4rem; }
  .icon-btn { background:rgba(255,255,255,.15); color:inherit; border:none; border-radius:8px; padding:.45rem .7rem; font-size:.85rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:.3rem; transition:background-color .2s; }
  .icon-btn:hover { background:rgba(255,255,255,.28); }

  #log { flex:1; overflow-y:auto; padding:1.4rem 1.2rem; max-width:800px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:1rem; }
  
  /* 1. Welcome Hero Banner */
  .hero-banner { background:linear-gradient(135deg, rgba(46,125,50,.1) 0%, rgba(129,199,132,.12) 100%); border:1px solid var(--border); border-radius:16px; padding:1.1rem 1.3rem; margin-bottom:.5rem; animation:fadeIn .3s ease-out; }
  .hero-title { margin:0 0 .3rem; font-size:1.1rem; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:.4rem; }
  .hero-desc { margin:0; font-size:.9rem; color:var(--text-secondary); line-height:1.45; }
  .hero-tip { margin-top:.6rem; padding:.4rem .7rem; background:rgba(255,255,255,.6); border-radius:8px; font-size:.82rem; font-weight:500; color:var(--text-secondary); display:inline-block; }
  body[data-theme="dark"] .hero-tip { background:rgba(0,0,0,.25); }

  /* Message & Bubbles */
  .msg { display:flex; gap:.65rem; align-items:flex-end; max-width:85%; animation:fadeIn .25s ease-out; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg.agent { align-self:flex-start; }
  
  .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex-shrink:0; background:rgba(46,125,50,.12); border:1px solid var(--border); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .msg.user .avatar { background:linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); color:#fff; font-size:.95rem; border:none; }
  
  .bubble-wrapper { display:flex; flex-direction:column; gap:.25rem; max-width:100%; position:relative; }
  .bubble-header { display:flex; justify-content:space-between; align-items:center; }
  .sender-name { font-size:.75rem; color:var(--text-secondary); font-weight:600; margin-left:.35rem; }
  .msg.user .sender-name { text-align:right; margin-right:.35rem; }

  .bubble { position:relative; padding:.8rem 1.1rem; border-radius:18px; border-bottom-left-radius:4px; background:var(--bubble-bg); color:var(--text-primary); border:1px solid var(--border); text-align:left; line-height:1.6; font-size:.95rem; white-space:pre-wrap; word-break:break-word; box-shadow:0 2px 6px rgba(0,0,0,.05); }
  .msg.user .bubble { background:linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); color:#ffffff; border:none; border-radius:18px; border-bottom-right-radius:4px; box-shadow:0 2px 8px rgba(46,125,50,.25); }
  
  .bubble.rich { background:transparent; border:none; padding:0; box-shadow:none; white-space:normal; }
  
  /* 4. Copy Button on Agent Message */
  .copy-btn { position:absolute; top:4px; right:6px; background:transparent; border:none; font-size:.78rem; color:var(--text-secondary); cursor:pointer; opacity:0; transition:opacity .2s, color .2s; border-radius:4px; padding:2px 4px; }
  .bubble-wrapper:hover .copy-btn { opacity:.8; }
  .copy-btn:hover { color:var(--accent); opacity:1; }

  /* 2. Interactive Sprout Loader */
  .sprout-loader-container { display:inline-flex; align-items:center; gap:.5rem; padding:.2rem 0; }
  .sprout-icon { display:inline-block; font-size:1.4rem; animation:sproutGrow 1.2s infinite ease-in-out alternate; transform-origin:bottom center; }
  .loader-dots { display:inline-flex; gap:3px; }
  .loader-dots span { width:5px; height:5px; background:var(--accent); border-radius:50%; animation:dotPulse .9s infinite alternate; }
  .loader-dots span:nth-child(2) { animation-delay:.2s; }
  .loader-dots span:nth-child(3) { animation-delay:.4s; }

  @keyframes sproutGrow {
    0% { transform:scale(.85) rotate(-6deg); }
    100% { transform:scale(1.2) rotate(6deg); }
  }
  @keyframes dotPulse {
    0% { opacity:.3; transform:scale(.8); }
    100% { opacity:1; transform:scale(1.2); }
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(6px); }
    to { opacity:1; transform:translateY(0); }
  }

  /* Form & Input Elements */
  form { display:flex; gap:.5rem; padding:1rem; border-top:1px solid var(--border); background:var(--card-bg); max-width:800px; width:100%; margin:0 auto; }
  input { flex:1; padding:.75rem 1rem; border:1px solid var(--border); border-radius:12px; font-size:1rem; background:var(--bg); color:var(--text-primary); outline:none; transition:border-color .2s; }
  input:focus { border-color:var(--accent); }
  button.send-btn { padding:.75rem 1.3rem; border:none; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition:background-color .2s; display:flex; align-items:center; gap:.3rem; }
  button.send-btn:hover { background:var(--accent-hover); }

  /* --- A2UI component styles & 3. Plant Spec Badges --- */
  .a2card { border:1px solid var(--border); border-radius:14px; padding:1.1rem; background:var(--card-bg); box-shadow:0 2px 8px rgba(0,0,0,.06); max-width:100%; position:relative; overflow:hidden; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; }
  .a2text.a2-h1 { font-size:1.45rem; font-weight:700; color:var(--accent); }
  .a2text.a2-h2 { font-size:1.2rem; font-weight:700; color:var(--accent); }
  .a2text.a2-h3 { font-size:1.05rem; font-weight:600; }
  .a2text.a2-h4 { font-size:.95rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:var(--text-secondary); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.45rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:10px; display:block; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .a2video { max-width:100%; border-radius:10px; display:block; box-shadow:0 2px 8px rgba(0,0,0,.12); margin-top:.5rem; background:#000; }
  
  /* Quick questions row */
  .quick-prompts { display:flex; gap:.5rem; padding:.5rem 1rem 0; max-width:800px; width:100%; margin:0 auto; overflow-x:auto; }
  .prompt-btn { flex:1; min-width:140px; padding:.5rem .85rem; border:1px solid var(--border); border-radius:20px; background:var(--card-bg); color:var(--accent); font-size:.85rem; font-weight:600; cursor:pointer; text-align:center; white-space:nowrap; transition:all .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .prompt-btn:hover { background:rgba(46,125,50,.1); border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <span>🌱</span>
    <span>SproutCare</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="theme-toggle" title="테마 전환">🌓 <span id="theme-text">모드</span></button>
    <button class="icon-btn" id="reset-btn" title="새 대화 시작">🔄 새 대화</button>
  </div>
</header>
<div id="log">
  <div class="hero-banner" id="hero-banner">
    <div class="hero-title">🌿 스마트 가드너 어시스턴트에 오신 것을 환영합니다!</div>
    <div class="hero-desc">화분 물주기 주기, 맞춤형 흙 배합비 계산, 반려동물 안전성 검사까지 언제든 질문해 주세요.</div>
    <div class="hero-tip">💡 오늘의 팁: 몬스테라는 겉흙이 2~3cm 말랐을 때 듬뿍 물을 주는 것이 좋습니다.</div>
  </div>
</div>
<div class="quick-prompts">
  <button type="button" class="prompt-btn" data-query="초보자에게 추천하는 실내 공기정화 식물 알려줘">🌿 식물 추천받기</button>
  <button type="button" class="prompt-btn" data-query="몬스테라 물주기 방법과 흙 배합 비율 알려줘">🪴 몬스테라 케어 가이드</button>
  <button type="button" class="prompt-btn" data-query="반려동물(강아지/고양이)에게 안전한 식물 추천해줘">🐾 반려동물 안전 식물</button>
</div>
<form id="form">
  <input id="input" placeholder="반려식물에 대해 무엇이든 물어보세요…" autocomplete="off" autofocus>
  <button class="send-btn">전송</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🌱");
  const wrapper = el("div", "bubble-wrapper");
  
  const header = el("div", "bubble-header");
  const sender = el("div", "sender-name", who === "user" ? "나" : "SproutCare");
  header.appendChild(sender);
  
  const b = el("div", "bubble");
  
  if (who === "agent") {
    const copyBtn = el("button", "copy-btn", "📋 복사");
    copyBtn.type = "button";
    copyBtn.title = "답변 복사";
    copyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const textToCopy = b.innerText || b.textContent;
      navigator.clipboard.writeText(textToCopy).then(() => {
        copyBtn.textContent = "✓ 완료!";
        setTimeout(() => { copyBtn.textContent = "📋 복사"; }, 1500);
      });
    });
    wrapper.appendChild(copyBtn);
  }

  wrapper.appendChild(header);
  wrapper.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(wrapper);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

// 2. Interactive Sprout Loader
function showSproutLoader(b) {
  b.innerHTML = `
    <div class="sprout-loader-container">
      <span class="sprout-icon">🌱</span>
      <span style="font-size:0.85rem; color:var(--text-secondary); font-weight:500;">식물 도감을 살피는 중</span>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function extractA2UIFromText(text) {
  const parts = [];
  const tagRegex = /<a2ui-json>([\s\S]*?)<\/a2ui-json>/g;
  let match;
  let lastIndex = 0;
  let found = false;

  while ((match = tagRegex.exec(text)) !== null) {
    found = true;
    const prefix = text.substring(lastIndex, match.index).trim();
    if (prefix) parts.push({ kind: "text", text: prefix });
    
    try {
      const parsed = JSON.parse(match[1].trim());
      if (parsed.components) {
        const sid = parsed.surfaceId || "default";
        const rootId = parsed.components.find(c => c.id === "root") ? "root" : (parsed.components[0]?.id || "root");
        parts.push({ kind: "a2ui", data: { beginRendering: { surfaceId: sid, root: rootId } } });
        parts.push({ kind: "a2ui", data: { surfaceUpdate: { surfaceId: sid, components: parsed.components } } });
      } else if (Array.isArray(parsed)) {
        parsed.forEach(item => parts.push({ kind: "a2ui", data: item }));
      } else {
        parts.push({ kind: "a2ui", data: parsed });
      }
    } catch (e) {
      parts.push({ kind: "text", text: match[1] });
    }
    lastIndex = tagRegex.lastIndex;
  }

  if (found) {
    const suffix = text.substring(lastIndex).trim();
    if (suffix) parts.push({ kind: "text", text: suffix });
    return parts;
  }
  return null;
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  
  // Flatten and unpack any text parts that contain embedded A2UI tags
  const unpackedParts = [];
  for (const p of parts) {
    if (p && p.kind === "text" && p.text && p.text.includes("<a2ui-json>")) {
      const extracted = extractA2UIFromText(p.text);
      if (extracted) {
        unpackedParts.push(...extracted);
        continue;
      }
    }
    unpackedParts.push(p);
  }

  const texts = unpackedParts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = unpackedParts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n\n").trim();
  const wrapper = b.parentElement;

  if (textStr) {
    b.textContent = textStr;
    // Check if reply text contains an mp4 video URL
    const videoMatch = textStr.match(/https:\/\/storage\.googleapis\.com\/[^\s"')>]+\.mp4/);
    if (videoMatch && wrapper) {
      const vid = el("video", "a2video");
      vid.src = videoMatch[0];
      vid.controls = true;
      vid.playsInline = true;
      vid.preload = "metadata";
      wrapper.appendChild(vid);
    }
    // Check if reply text contains a png/jpg/jpeg/webp image URL not already in A2UI
    const imgMatch = textStr.match(/https:\/\/storage\.googleapis\.com\/[^\s"')>]+\.(?:png|jpe?g|webp)/i);
    if (imgMatch && wrapper && !wrapper.querySelector(`img[src="${imgMatch[0]}"]`)) {
      const img = el("img", "a2img");
      img.src = imgMatch[0];
      img.alt = "생성된 식물 이미지";
      img.style.marginTop = ".5rem";
      wrapper.appendChild(img);
    }
  } else if (!a2ui.length) {
    b.textContent = "(no response)";
  } else {
    // Only A2UI cards returned, hide empty text bubble
    b.style.display = "none";
  }

  if (a2ui.length && wrapper) {
    const cardContainer = el("div", "a2-cards-container");
    cardContainer.style.marginTop = textStr ? "0.6rem" : "0";
    cardContainer.style.display = "flex";
    cardContainer.style.flexDirection = "column";
    cardContainer.style.gap = "0.6rem";
    cardContainer.style.width = "100%";
    
    if (renderSurface(a2ui, cardContainer)) {
      wrapper.appendChild(cardContainer);
    } else {
      const fb = flattenText(a2ui);
      if (fb) {
        b.style.display = "block";
        b.textContent = (b.textContent ? b.textContent + "\n\n" : "") + fb;
      }
    }
  }
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
async function sendMessage(text) {
  if (!text) return;
  
  // Hide hero banner on first conversation
  const hero = document.getElementById("hero-banner");
  if (hero) hero.style.display = "none";

  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  showSproutLoader(b);
  
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (text) await sendMessage(text);
});

document.querySelectorAll(".prompt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const query = btn.getAttribute("data-query");
    if (query) sendMessage(query);
  });
});

// 4. Reset Conversation
document.getElementById("reset-btn").addEventListener("click", () => {
  log.innerHTML = `
    <div class="hero-banner" id="hero-banner">
      <div class="hero-title">🌿 새로운 대화가 시작되었습니다!</div>

// 5. Theme Toggle (Forest Natural Theme vs Light Theme)
const themeToggle = document.getElementById("theme-toggle");
const themeText = document.getElementById("theme-text");
themeToggle.addEventListener("click", () => {
  const isDark = document.body.getAttribute("data-theme") === "dark";
  if (isDark) {
    document.body.removeAttribute("data-theme");
    themeText.textContent = "모드";
  } else {
    document.body.setAttribute("data-theme", "dark");
    themeText.textContent = "라이트";
  }
});
</script>
